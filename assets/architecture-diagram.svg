<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="500" fill="url(#bg)"/>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#6366f1" stroke-width="0.2" opacity="0.15"/>
  </pattern>
  <rect width="1200" height="500" fill="url(#grid)"/>
  <!-- USER -->
  <rect x="450" y="10" width="300" height="60" rx="12" fill="#1e1b4b" stroke="#6366f1" stroke-width="2"/>
  <text x="600" y="38" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#e2e8f0" text-anchor="middle">👤 USUARIO</text>
  <text x="600" y="56" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">AGENTS.md + ~/.config/opencode/</text>
  <!-- Arrow down -->
  <line x1="600" y1="70" x2="600" y2="100" stroke="url(#line)" stroke-width="2" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/></marker></defs>
  <!-- OpenCode CLI -->
  <rect x="350" y="100" width="500" height="70" rx="12" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
  <text x="600" y="128" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#3b82f6" text-anchor="middle">⚙️ OpenCode CLI (Bun)</text>
  <text x="600" y="150" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">AGENTS.md · opencode.jsonc · .env</text>
  <!-- Arrows from CLI -->
  <line x1="450" y1="170" x2="150" y2="210" stroke="#8b5cf6" stroke-width="1.5"/>
  <line x1="525" y1="170" x2="400" y2="210" stroke="#f59e0b" stroke-width="1.5"/>
  <line x1="675" y1="170" x2="800" y2="210" stroke="#ec4899" stroke-width="1.5"/>
  <line x1="750" y1="170" x2="1050" y2="210" stroke="#f97316" stroke-width="1.5"/>
  <!-- AGENTS -->
  <rect x="30" y="210" width="240" height="60" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
  <text x="150" y="238" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#8b5cf6" text-anchor="middle">🤖 AGENTS (16)</text>
  <text x="150" y="256" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Symlinks a agents-library/</text>
  <!-- SKILLS -->
  <rect x="280" y="210" width="240" height="60" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="400" y="238" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f59e0b" text-anchor="middle">⚡ SKILLS (20)</text>
  <text x="400" y="256" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Ciclo SDD completo</text>
  <!-- PLUGINS -->
  <rect x="680" y="210" width="240" height="60" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="2"/>
  <text x="800" y="238" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ec4899" text-anchor="middle">🔌 PLUGINS (8)</text>
  <text x="800" y="256" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Guardrails + Kanban + Sandbox</text>
  <!-- MCP -->
  <rect x="930" y="210" width="240" height="60" rx="10" fill="#1e293b" stroke="#f97316" stroke-width="2"/>
  <text x="1050" y="238" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f97316" text-anchor="middle">📡 MCP (5)</text>
  <text x="1050" y="256" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Ollama + Memoria + Docs</text>
  <!-- Arrows to multiagent -->
  <line x1="150" y1="270" x2="300" y2="310" stroke="#8b5cf6" stroke-width="1.5"/>
  <line x1="400" y1="270" x2="450" y2="310" stroke="#f59e0b" stroke-width="1.5"/>
  <line x1="800" y1="270" x2="750" y2="310" stroke="#ec4899" stroke-width="1.5"/>
  <!-- MULTIAGENT -->
  <rect x="200" y="310" width="800" height="80" rx="12" fill="#172554" stroke="#06b6d4" stroke-width="2"/>
  <text x="600" y="338" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#06b6d4" text-anchor="middle">👥 MULTIAGENTE POR CAPAS</text>
  <text x="300" y="365" font-family="system-ui, sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">🎯 Coordinador</text>
  <text x="500" y="365" font-family="system-ui, sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">⚡ Implementador A</text>
  <text x="700" y="365" font-family="system-ui, sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">⚡ Implementador B</text>
  <text x="900" y="365" font-family="system-ui, sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">✅ Verifier</text>
  <line x1="350" y1="355" x2="450" y2="355" stroke="#06b6d4" stroke-width="1" stroke-dasharray="4"/>
  <line x1="550" y1="355" x2="650" y2="355" stroke="#06b6d4" stroke-width="1" stroke-dasharray="4"/>
  <line x1="750" y1="355" x2="850" y2="355" stroke="#06b6d4" stroke-width="1" stroke-dasharray="4"/>
  <!-- Arrow to router -->
  <line x1="600" y1="390" x2="600" y2="420" stroke="url(#line)" stroke-width="2"/>
  <!-- LOCAL ROUTER -->
  <rect x="300" y="420" width="600" height="70" rx="12" fill="#1a1a2e" stroke="#f97316" stroke-width="2"/>
  <text x="600" y="448" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f97316" text-anchor="middle">🏠 LOCAL MODEL ROUTER (Ollama)</text>
  <text x="350" y="472" font-family="system-ui, sans-serif" font-size="10" fill="#22c55e" text-anchor="middle">🔧 coder:3b</text>
  <text x="500" y="472" font-family="system-ui, sans-serif" font-size="10" fill="#3b82f6" text-anchor="middle">💬 chat:4b</text>
  <text x="650" y="472" font-family="system-ui, sans-serif" font-size="10" fill="#8b5cf6" text-anchor="middle">🧠 reasoning</text>
  <text x="800" y="472" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Auto-off: 10min</text>
</svg>