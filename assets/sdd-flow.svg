<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="200" fill="url(#bg)"/>
  <!-- Step boxes -->
  <rect x="20" y="40" width="180" height="120" rx="12" fill="#22c55e" opacity="0.15" stroke="#22c55e" stroke-width="2"/>
  <text x="110" y="75" font-family="system-ui, sans-serif" font-size="24" text-anchor="middle">📝</text>
  <text x="110" y="100" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#22c55e" text-anchor="middle">SPECIFY</text>
  <text x="110" y="118" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">spec.md</text>
  <text x="110" y="135" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Alcance + Criterios</text>
  <!-- Arrow 1 -->
  <line x1="200" y1="100" x2="230" y2="100" stroke="#22c55e" stroke-width="2"/>
  <polygon points="228,95 238,100 228,105" fill="#22c55e"/>
  <rect x="230" y="40" width="180" height="120" rx="12" fill="#3b82f6" opacity="0.15" stroke="#3b82f6" stroke-width="2"/>
  <text x="320" y="75" font-family="system-ui, sans-serif" font-size="24" text-anchor="middle">📋</text>
  <text x="320" y="100" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#3b82f6" text-anchor="middle">PLAN</text>
  <text x="320" y="118" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">plan.md</text>
  <text x="320" y="135" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Arquitectura + Riesgos</text>
  <!-- Arrow 2 -->
  <line x1="410" y1="100" x2="440" y2="100" stroke="#3b82f6" stroke-width="2"/>
  <polygon points="438,95 448,100 438,105" fill="#3b82f6"/>
  <rect x="440" y="40" width="180" height="120" rx="12" fill="#8b5cf6" opacity="0.15" stroke="#8b5cf6" stroke-width="2"/>
  <text x="530" y="75" font-family="system-ui, sans-serif" font-size="24" text-anchor="middle">✅</text>
  <text x="530" y="100" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#8b5cf6" text-anchor="middle">TASKS</text>
  <text x="530" y="118" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">tasks.md</text>
  <text x="530" y="135" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Lista verificable</text>
  <!-- Arrow 3 -->
  <line x1="620" y1="100" x2="650" y2="100" stroke="#8b5cf6" stroke-width="2"/>
  <polygon points="648,95 658,100 648,105" fill="#8b5cf6"/>
  <rect x="650" y="40" width="180" height="120" rx="12" fill="#f59e0b" opacity="0.15" stroke="#f59e0b" stroke-width="2"/>
  <text x="740" y="75" font-family="system-ui, sans-serif" font-size="24" text-anchor="middle">🔨</text>
  <text x="740" y="100" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f59e0b" text-anchor="middle">IMPLEMENT</text>
  <text x="740" y="118" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Multiagente</text>
  <text x="740" y="135" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Task tool aislado</text>
  <!-- Arrow 4 -->
  <line x1="830" y1="100" x2="860" y2="100" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="858,95 868,100 858,105" fill="#f59e0b"/>
  <rect x="860" y="40" width="180" height="120" rx="12" fill="#06b6d4" opacity="0.15" stroke="#06b6d4" stroke-width="2"/>
  <text x="950" y="75" font-family="system-ui, sans-serif" font-size="24" text-anchor="middle">🔍</text>
  <text x="950" y="100" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#06b6d4" text-anchor="middle">VERIFY</text>
  <text x="950" y="118" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">PASS / FAIL</text>
  <text x="950" y="135" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Evidencia independiente</text>
  <!-- Loop back -->
  <path d="M 950 160 Q 950 190 550 190 Q 110 190 110 160" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6"/>
  <text x="550" y="188" font-family="system-ui, sans-serif" font-size="10" fill="#ef4444" text-anchor="middle">si FAIL → volver a SPECIFY</text>
</svg>