<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6366f1" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)"/>
  <!-- Decorative circles -->
  <circle cx="100" cy="150" r="80" fill="#6366f1" opacity="0.1"/>
  <circle cx="1100" cy="150" r="120" fill="#8b5cf6" opacity="0.08"/>
  <circle cx="600" cy="50" r="60" fill="#3b82f6" opacity="0.06"/>
  <!-- Grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#6366f1" stroke-width="0.3" opacity="0.2"/>
  </pattern>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <!-- Center line -->
  <line x1="0" y1="150" x2="1200" y2="150" stroke="url(#glow)" stroke-width="1" opacity="0.3"/>
  <!-- Title -->
  <text x="600" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" fill="#e2e8f0" text-anchor="middle" filter="url(#shadow)">OpenCode Config</text>
  <!-- Subtitle -->
  <text x="600" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#94a3b8" text-anchor="middle">Tu estación de trabajo de IA completa. Portable. Potente. Ahorrador de tokens.</text>
  <!-- Badges -->
  <rect x="200" y="200" width="100" height="30" rx="15" fill="#22c55e" opacity="0.9"/>
  <text x="250" y="220" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">16 AGENTS</text>
  <rect x="320" y="200" width="100" height="30" rx="15" fill="#f59e0b" opacity="0.9"/>
  <text x="370" y="220" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">20 SKILLS</text>
  <rect x="440" y="200" width="100" height="30" rx="15" fill="#ec4899" opacity="0.9"/>
  <text x="490" y="220" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">8 PLUGINS</text>
  <rect x="560" y="200" width="100" height="30" rx="15" fill="#8b5cf6" opacity="0.9"/>
  <text x="610" y="220" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3 PROFILES</text>
  <rect x="680" y="200" width="100" height="30" rx="15" fill="#f97316" opacity="0.9"/>
  <text x="730" y="220" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">5 MCP</text>
  <rect x="800" y="200" width="120" height="30" rx="15" fill="#06b6d4" opacity="0.9"/>
  <text x="860" y="220" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">233 LIBRARY</text>
</svg>