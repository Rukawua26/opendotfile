<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="350" fill="url(#bg)"/>
  <!-- START -->
  <rect x="450" y="10" width="300" height="50" rx="25" fill="#1e1b4b" stroke="#6366f1" stroke-width="2"/>
  <text x="600" y="42" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#e2e8f0" text-anchor="middle">🚀 Tarea nueva</text>
  <!-- Arrow -->
  <line x1="600" y1="60" x2="600" y2="85" stroke="#6366f1" stroke-width="2"/>
  <polygon points="595,83 600,93 605,83" fill="#6366f1"/>
  <!-- Decision -->
  <polygon points="600,90 700,130 600,170 500,130" fill="#172554" stroke="#f97316" stroke-width="2"/>
  <text x="600" y="127" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#f97316" text-anchor="middle">¿Es crítica o</text>
  <text x="600" y="142" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#f97316" text-anchor="middle">de seguridad?</text>
  <!-- YES path -->
  <line x1="500" y1="130" x2="300" y2="130" stroke="#ef4444" stroke-width="2"/>
  <text x="400" y="123" font-family="system-ui, sans-serif" font-size="10" fill="#ef4444" text-anchor="middle">SÍ</text>
  <rect x="150" y="105" width="150" height="50" rx="10" fill="#dc2626" opacity="0.2" stroke="#dc2626" stroke-width="2"/>
  <text x="225" y="127" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">☁️ Cloud Model</text>
  <text x="225" y="143" font-family="system-ui, sans-serif" font-size="9" fill="#fca5a5" text-anchor="middle">gpt-5.6-sol</text>
  <!-- NO path -->
  <line x1="700" y1="130" x2="850" y2="130" stroke="#22c55e" stroke-width="2"/>
  <text x="775" y="123" font-family="system-ui, sans-serif" font-size="10" fill="#22c55e" text-anchor="middle">NO</text>
  <rect x="850" y="105" width="200" height="50" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
  <text x="950" y="127" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#8b5cf6" text-anchor="middle">🔀 route_model()</text>
  <text x="950" y="143" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">clasifica la tarea</text>
  <!-- Arrows from router -->
  <line x1="880" y1="155" x2="750" y2="210" stroke="#8b5cf6" stroke-width="1.5"/>
  <line x1="950" y1="155" x2="950" y2="210" stroke="#8b5cf6" stroke-width="1.5"/>
  <line x1="1020" y1="155" x2="1150" y2="210" stroke="#8b5cf6" stroke-width="1.5"/>
  <!-- CODER -->
  <rect x="650" y="210" width="180" height="70" rx="10" fill="#059669" opacity="0.15" stroke="#059669" stroke-width="2"/>
  <text x="740" y="238" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#059669" text-anchor="middle">🔧 coder:3b</text>
  <text x="740" y="256" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">qwen2.5-coder</text>
  <text x="740" y="270" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">código mecánico</text>
  <!-- CHAT -->
  <rect x="860" y="210" width="180" height="70" rx="10" fill="#2563eb" opacity="0.15" stroke="#2563eb" stroke-width="2"/>
  <text x="950" y="238" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle">💬 chat:4b</text>
  <text x="950" y="256" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">qwen3.5:4b</text>
  <text x="950" y="270" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">explicaciones</text>
  <!-- REASON -->
  <rect x="1070" y="210" width="180" height="70" rx="10" fill="#7c3aed" opacity="0.15" stroke="#7c3aed" stroke-width="2"/>
  <text x="1160" y="238" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#7c3aed" text-anchor="middle">🧠 reasoning</text>
  <text x="1160" y="256" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">phi4-mini</text>
  <text x="1160" y="270" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">lógica</text>
  <!-- Arrows to result -->
  <line x1="225" y1="155" x2="225" y2="310" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4"/>
  <line x1="740" y1="280" x2="740" y2="310" stroke="#059669" stroke-width="1.5"/>
  <line x1="950" y1="280" x2="950" y2="310" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="1160" y1="280" x2="1160" y2="310" stroke="#7c3aed" stroke-width="1.5"/>
  <!-- RESULT -->
  <rect x="400" y="310" width="400" height="35" rx="17" fill="#f59e0b" opacity="0.2" stroke="#f59e0b" stroke-width="2"/>
  <text x="600" y="333" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f59e0b" text-anchor="middle">📊 Resultado → Usuario</text>
</svg>